id: order-owner-check
snapshots:
  ? |
    function getOrder(req, id) {
      const customer = currentCustomer(req);
      if (!customer) return { status: 401 };
      const order = findOrder(id);
      if (!order) return notFound('order');
      return { status: 200, body: present(order) };
    }
